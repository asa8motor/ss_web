<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss_web</title>
  <link rel="stylesheet" href="utilities.css">
  <style>
    /* ========================================================= */
    /* ⚙️ НАСТРОЙКИ ПРОСТРАНСТВА И ТЕНЕЙ                          */
    /* ========================================================= */
    :root {
      --gap-pc: 350px;
      --gap-mobile: 0px;
      /* Базовая ширина дизайна из Figma */
      --design-width: 414;
      /* Реальный размер 1 figma-px (пересчитываем из JS) */
      --unit: 1px;
      /* Та же величина, но без 'px' — нужна для transform: scale() */
      --unit-scale: 1;

      /* ===================================================== */
      /* РАЗМЕР ОКНА LORE                                       */
      /* 1.0 = тот размер что был у тебя на 1440px экране.     */
      /* Крути эту переменную чтобы сделать больше/меньше.     */
      /* Anchor масштабирования = кружок закрытия окна (top-right). */
      /* ===================================================== */
      --lore-scale: 1.0;
    }

    @media (max-width: 768px) {
      :root { --lore-scale: 2.2; }
    }

    /* Шрифты */
    @font-face { font-family: 'Helvetica Neue'; src: url('fonts/HelveticaNeue-Thin.ttf') format('truetype'); font-weight: 100; font-style: normal; }
    @font-face { font-family: 'Helvetica Neue'; src: url('fonts/HelveticaNeue-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Helvetica Neue'; src: url('fonts/HelveticaNeue-Light.ttf') format('truetype'); font-weight: 300; font-style: normal; }

    .custom-scrollbar::-webkit-scrollbar { width: 10px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; margin-top: 4px; margin-bottom: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #D9D9D9; border-radius: 10px; border: 3px solid #52525b; }

    body, html { background-color: #535353; margin: 0; padding: 0; width: 100%; overflow-x: hidden; }

    /* ========================================================= */
    /* ГЛАВНЫЙ ФРЕЙМ — реальные размеры через --unit              */
    /* ========================================================= */
    #scale-container {
      width: 100%;
      display: flex;
      justify-content: center;
      position: relative;
      margin-bottom: 50px;
    }

    #scale-wrapper {
      width: calc(var(--design-width) * var(--unit));
      height: calc(10025 * var(--unit));
      position: relative;
    }

    #scale-wrapper img,
    #scale-wrapper video {
      object-fit: cover !important;
      object-position: center !important;
      display: block !important;
      max-width: none !important;
    }
    #scale-wrapper svg {
      display: block;
      max-width: none;
      overflow: visible !important;
    }

    /* ========================================================= */
    /* СЛОЙ С ВЕКТОРНЫМ ТЕКСТОМ                                   */
    /* Внутри слоя все координаты ОСТАЮТСЯ в figma-px (как из     */
    /* Figma). Сам слой имеет фиксированные figma-размеры         */
    /* (414 × 9807px) и масштабируется ровно в (--unit-scale) раз */
    /* — это то же самое, что делал старый общий transform.       */
    /*                                                            */
    /* top: 136px — это figma-смещение, и transform-origin задан  */
    /* так, чтобы слой "приклеивался" к нужной точке родителя.    */
    /* ========================================================= */
    #svg-text-layer {
      position: absolute !important;
      top: calc(136 * var(--unit)) !important;
      left: 0 !important;
      width: 414px !important;
      height: 9421px !important;
      pointer-events: none;
      z-index: 30;
      display: flex !important;
      justify-content: center !important;
      align-items: flex-start !important;
      transform: scale(var(--unit-scale));
      transform-origin: top left;
    }
    /* ========================================================= */
    /* ОКНО LORE — размер через --unit и --lore-scale            */
    /* Базовые figma-размеры: 145 × 190 (≈ 260×340 на 1440px)   */
    /* ========================================================= */
    #lore-window {
      width:    calc(145 * var(--unit) * var(--lore-scale));
      max-height: calc(190 * var(--unit) * var(--lore-scale));
    }
    /* Текст внутри окна — 11px на 1440px экране = 6.15 figma-px */
    #lore-content {
      font-size: calc(6.15 * var(--unit) * var(--lore-scale)) !important;
    }
    /* Заголовок LORE — 23px на 1440px = ~12.9 figma-px */
    #lore-window .lore-title {
      font-size: calc(12.9 * var(--unit) * var(--lore-scale));
    }
    /* Скейл-анимация открытия окна — через transform, origin = правый верхний угол */
    #lore-window.scale-95  { transform: scale(0.95); }
    #lore-window.scale-100 { transform: scale(1);    }

    .shadow-left  { position: absolute; top: 0; bottom: 0; width: 50px; background: rgba(0,0,0,0.49); filter: blur(16px); left: -30px; pointer-events: none; }
    .shadow-right { position: absolute; top: 0; bottom: 0; width: 50px; background: rgba(0,0,0,0.49); filter: blur(16px); right: -30px; pointer-events: none; }

    @media (max-width: 768px) {
      .shadow-left  { left: -25px; }
      .shadow-right { right: -25px; }
    }
  </style>
  
  <!-- Вычисляем --unit ДО первой отрисовки страницы (никаких прыжков скролла) -->
  <script>
    (function () {
      var DESIGN_WIDTH = 414;
      var GAP_PC = 350;
      var GAP_MOBILE = 15; // px с каждой стороны — серая полоса для теней

      function applyUnit() {
        var isMobile = window.innerWidth <= 768;
        var gap = isMobile ? GAP_MOBILE : GAP_PC;
        var available = window.innerWidth - gap * 2;
        if (available < 200) available = window.innerWidth; // защита: на узких десктопах не уходим в минус
        var unit = available / DESIGN_WIDTH;
        document.documentElement.style.setProperty('--unit', unit + 'px');
        // Для слоя со svg-текстом, который остаётся в figma-px и масштабируется transform'ом.
        document.documentElement.style.setProperty('--unit-scale', unit);
      }

      applyUnit();

      var lastWidth = window.innerWidth;
      window.addEventListener('resize', function () {
        if (window.innerWidth === lastWidth) return; // игнорируем resize по высоте (мобильные адресные бары)
        lastWidth = window.innerWidth;
        applyUnit();
      });
    })();
  </script>
</head>

      const start = window.scrollY || document.documentElement.scrollTop;
      if (start === 0) return;
      
      const duration = 600;
      const startTime = performance.now();

      function animateScroll(currentTime) {
        const timeElapsed = currentTime - startTime;
        let progress = timeElapsed / duration;

        if (progress >= 1) {
          window.scrollTo(0, 0);
          scrollAnimationId = null;
          return;
        }

        // Плавная кривая easeOutQuart
        const ease = 1 - Math.pow(1 - progress, 4);
        window.scrollTo(0, start * (1 - ease));
        scrollAnimationId = requestAnimationFrame(animateScroll);
      }

    function typeWriterLine(text, elements, animationId) {
      return new Promise(resolve => {
        if (!text) { resolve(); return; }
        const { visibleSpan, invisibleSpan } = elements;
        let iteration = 0;
        const interval = setInterval(() => {
          if (!isOpen || animationId !== currentAnimationId) {
            clearInterval(interval); resolve(); return;
          }
          let displayStr = ''; let invisibleStr = '';
          for (let i = 0; i < text.length; i++) {
            if (i < iteration) displayStr += text[i];
            else if (i < iteration + 5) displayStr += text[i] === ' ' ? ' ' : glitchChars[Math.floor(Math.random() * glitchChars.length)];
            else invisibleStr += text[i];
          }
          visibleSpan.innerText = displayStr; invisibleSpan.innerText = invisibleStr;
          iteration += 2.5; 
          if (iteration >= text.length) {
            clearInterval(interval);
            visibleSpan.innerText = text; invisibleSpan.innerText = '';
            resolve();
          }
        }, 10); 
      });

      e.stopPropagation();
      contactOverlay.classList.remove('hidden');
      contactOverlay.classList.add('flex');
      
      requestAnimationFrame(() => {
        contactOverlay.classList.remove('opacity-0');
        contactOverlay.classList.add('opacity-100');
      });
    });

    contactOverlay.addEventListener('click', (e) => {
      if (e.target === contactOverlay) {
        contactOverlay.classList.remove('opacity-100');
        contactOverlay.classList.add('opacity-0');
        
        setTimeout(() => {
          contactOverlay.classList.add('hidden');
          contactOverlay.classList.remove('flex');
        }, 300);
      }
    });

    // =========================================================================
    // VIDEO LAZY PLAY — воспроизводится только когда видео в viewport
    // =========================================================================
    (function () {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var video = entry.target;
          if (entry.isIntersecting) {
            video.play().catch(function () {});
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('#scale-wrapper video').forEach(function (video) {
        observer.observe(video);
      });
    })();

  </script>
</body>
